name: Support
description: Got a question? Ask here
title: "[Q]: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        For bugs or ideas, please use the other forms.
  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Deliber version
      placeholder: ex. 0.1.0
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: ex. Chrome 142
